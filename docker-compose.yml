version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: dropclip_postgres
    environment:
      POSTGRES_DB: dropclip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dropclip_redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3.0
    container_name: dropclip_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  localstack_data: