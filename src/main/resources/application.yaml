spring:
  application:
    name: dropclip

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/dropclip
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: 127.0.0.1
      port: 6379

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000
  refresh-expiration: 604800000

aws:
  region: us-east-1
  endpoint: http://127.0.0.1:4566
  access-key: test
  secret-key: test
  s3:
    bucket: dropclip-videos