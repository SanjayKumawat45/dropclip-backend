spring:
  application:
    name: dropclip

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/dropclip
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true

  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://127.0.0.1:6379}

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: JWT_SECRET
  expiration: 86400000
  refresh-expiration: 604800000

aws:
  region: auto
  endpoint: https://cec9b28327aa26ddf3a5de7598821f9d.r2.cloudflarestorage.com
  access-key: ${R2_ACCESS_KEY_ID}
  secret-key: ${R2_SECRET_ACCESS_KEY}

  s3:
    bucket: dropclip-videos
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: DEBUG
    org.springframework.web: DEBUG
